<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin:0; }
  .display { font-family:'Plus Jakarta Sans',sans-serif; }
  .noscroll::-webkit-scrollbar { width:0; height:0; }
  .noscroll { -ms-overflow-style: none; scrollbar-width: none; }
  .field-input { background:#132E50; border:1.5px solid #1E4270; border-radius:10px; color:#fff; font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; padding:11px 12px; width:100%; outline:none; }
  .field-input::placeholder { color:#64748B; }
  .field-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:#94A3B8; margin-bottom:5px; display:block; }
</style>
</helmet>

<div style="width:390px;height:844px;background:#0D2340;display:flex;flex-direction:column;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;color:#fff;">

  <div style="flex-shrink:0;padding:22px 22px 0;">
    <div style="display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:10px;background:#132E50;font-size:11px;font-weight:700;color:#CBD5E1;width:fit-content;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Back
    </div>
  </div>

  <div class="noscroll" style="flex:1;overflow-y:auto;scrollbar-width:none;padding:0 22px 24px;">

    <div style="display:flex;align-items:center;gap:9px;margin:22px 0 26px;">
      <img src="humancare-logo.png" alt="HumanCare WorldWide" style="height:34px;width:auto;"/>
    </div>

    <div class="display" style="font-size:20px;font-weight:800;margin:0;">Patient / Family Sign In</div>
    <p style="font-size:12px;color:#94A3B8;margin:6px 0 22px;">Passwordless login — we'll text you a one-time code.</p>

    <div style="display:flex;flex-direction:column;gap:16px;">
      <div>
        <span class="field-label">Full Name *</span>
        <input class="field-input" value="{{name}}" onChange="{{setName}}" placeholder="As per travel document"/>
      </div>
      <div>
        <span class="field-label">Email Address *</span>
        <input class="field-input" value="{{email}}" onChange="{{setEmail}}" placeholder="you@example.com"/>
      </div>
      <div>
        <span class="field-label">Mobile Number *</span>
        <div style="display:flex;gap:8px;">
          <select class="field-input" style="width:88px;flex-shrink:0;" value="{{countryCode}}" onChange="{{setCountryCode}}">
            <option value="+91">+91 (IN)</option>
            <option value="+971">+971 (UAE)</option>
            <option value="+44">+44 (UK)</option>
            <option value="+1">+1 (US)</option>
          </select>
          <input class="field-input" value="{{phone}}" onChange="{{setPhone}}" placeholder="98765 43210"/>
        </div>
      </div>
    </div>

    <div style="margin-top:20px;display:flex;flex-direction:column;gap:14px;">
      <label style="display:flex;align-items:flex-start;gap:9px;cursor:pointer;">
        <div onClick="{{toggle1}}" style="cursor:pointer;flex-shrink:0;width:19px;height:19px;border-radius:5px;border:2px solid #34D399;background:{{box1bg}};display:flex;align-items:center;justify-content:center;margin-top:1px;">
          <sc-if value="{{c1}}" hint-placeholder-val="{{true}}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#0D2340" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></sc-if>
        </div>
        <span style="font-size:11px;color:#CBD5E1;line-height:1.5;">I agree to the <span style="color:#4FC3F7;font-weight:700;">Terms &amp; Conditions</span> and <span style="color:#4FC3F7;font-weight:700;">Privacy Policy</span>.</span>
      </label>
      <label style="display:flex;align-items:flex-start;gap:9px;cursor:pointer;">
        <div onClick="{{toggle2}}" style="cursor:pointer;flex-shrink:0;width:19px;height:19px;border-radius:5px;border:2px solid #34D399;background:{{box2bg}};display:flex;align-items:center;justify-content:center;margin-top:1px;">
          <sc-if value="{{c2}}" hint-placeholder-val="{{true}}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#0D2340" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></sc-if>
        </div>
        <span style="font-size:11px;color:#CBD5E1;line-height:1.5;">I agree to receive updates about my case, account, and HumanCare programs.</span>
      </label>
      <label style="display:flex;align-items:flex-start;gap:9px;cursor:pointer;">
        <div onClick="{{toggle3}}" style="cursor:pointer;flex-shrink:0;width:19px;height:19px;border-radius:5px;border:2px solid #34D399;background:{{box3bg}};display:flex;align-items:center;justify-content:center;margin-top:1px;">
          <sc-if value="{{c3}}" hint-placeholder-val="{{true}}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#0D2340" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></sc-if>
        </div>
        <span style="font-size:11px;color:#CBD5E1;line-height:1.5;">I understand this app provides coordination support only, not medical diagnosis or treatment.</span>
      </label>
    </div>

    <button onClick="{{submit}}" style="width:100%;padding:15px;border-radius:12px;background:linear-gradient(135deg,#4FC3F7,#38BDF8);color:#0D2340;font-weight:800;font-size:13px;border:none;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;opacity:{{btnOpacity}};margin-top:20px;">{{btnLabel}}</button>

    <div style="margin-top:16px;padding:14px;border-radius:14px;background:#132E50;border:1px solid #1E4270;">
      <p style="font-size:11px;color:#94A3B8;margin:0;line-height:1.6;"><span style="color:#fff;font-weight:700;">How it works:</span> we'll text a 6-digit one-time code to your mobile number to confirm it's you. New here? Your patient account is created automatically on first sign-in.</p>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: '', email: '', countryCode: '+91', phone: '', c1: true, c2: true, c3: true, status: 'idle' };
  }
  submit() {
    const st = this.state;
    const allChecked = st.c1 && st.c2 && st.c3;
    if (!st.name || !st.email || !st.phone || !allChecked || st.status !== 'idle') return;
    this.setState({ status: 'sending' });
    setTimeout(() => this.setState({ status: 'done' }), 900);
  }
  renderVals() {
    const st = this.state;
    const allChecked = st.c1 && st.c2 && st.c3;
    const filled = st.name && st.email && st.phone && allChecked;
    let label = 'Send OTP →';
    if (st.status === 'sending') label = 'Sending code…';
    if (st.status === 'done') label = 'Code Sent ✓ — Opening OTP screen';
    return {
      name: st.name, setName: (e) => this.setState({ name: e.target.value }),
      email: st.email, setEmail: (e) => this.setState({ email: e.target.value }),
      countryCode: st.countryCode, setCountryCode: (e) => this.setState({ countryCode: e.target.value }),
      phone: st.phone, setPhone: (e) => this.setState({ phone: e.target.value }),
      c1: st.c1, c2: st.c2, c3: st.c3,
      box1bg: st.c1 ? '#34D399' : 'transparent',
      box2bg: st.c2 ? '#34D399' : 'transparent',
      box3bg: st.c3 ? '#34D399' : 'transparent',
      toggle1: () => this.setState({ c1: !st.c1 }),
      toggle2: () => this.setState({ c2: !st.c2 }),
      toggle3: () => this.setState({ c3: !st.c3 }),
      submit: () => this.submit(),
      btnLabel: label,
      btnOpacity: filled ? '1' : '0.5',
    };
  }
}
</script>
</body>
</html>
