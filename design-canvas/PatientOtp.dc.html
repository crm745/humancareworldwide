<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin:0; }
  .display { font-family:'Plus Jakarta Sans',sans-serif; }
  .otp-box { text-align:center; font-size:19px; font-weight:700; border-radius:10px; padding:12px 0; width:100%; outline:none; font-family:'Plus Jakarta Sans',sans-serif; }
</style>
</helmet>

<div style="width:390px;height:844px;background:#0D2340;display:flex;flex-direction:column;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;color:#fff;padding:22px;">

  <div style="display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:10px;background:#132E50;font-size:11px;font-weight:700;color:#CBD5E1;width:fit-content;margin-top:6px;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    Back
  </div>

  <div style="display:flex;align-items:center;gap:9px;margin:26px 0 30px;">
    <img src="humancare-logo.png" alt="HumanCare WorldWide" style="height:34px;width:auto;"/>
  </div>

  <div class="display" style="font-size:20px;font-weight:800;margin:0;">Verify Your Number</div>
  <p style="font-size:12px;color:#94A3B8;margin:6px 0 26px;">6-digit code sent to <span style="color:#fff;font-weight:700;">+91 98765 43210</span></p>

  <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px;">
    <input class="otp-box" maxlength="1" value="{{d0}}" onChange="{{setD0}}" style="background:{{bg0}};border:2px solid {{border0}};color:{{color0}};"/>
    <input class="otp-box" maxlength="1" value="{{d1}}" onChange="{{setD1}}" style="background:{{bg1}};border:2px solid {{border1}};color:{{color1}};"/>
    <input class="otp-box" maxlength="1" value="{{d2}}" onChange="{{setD2}}" style="background:{{bg2}};border:2px solid {{border2}};color:{{color2}};"/>
    <input class="otp-box" maxlength="1" value="{{d3}}" onChange="{{setD3}}" style="background:{{bg3}};border:2px solid {{border3}};color:{{color3}};"/>
    <input class="otp-box" maxlength="1" value="{{d4}}" onChange="{{setD4}}" style="background:{{bg4}};border:2px solid {{border4}};color:{{color4}};"/>
    <input class="otp-box" maxlength="1" value="{{d5}}" onChange="{{setD5}}" style="background:{{bg5}};border:2px solid {{border5}};color:{{color5}};"/>
  </div>

  <sc-if value="{{hasError}}" hint-placeholder-val="{{false}}">
    <div style="font-size:12px;color:#F87171;margin-top:10px;">{{errorMsg}}</div>
  </sc-if>

  <button onClick="{{verify}}" style="width:100%;padding:15px;border-radius:12px;background:linear-gradient(135deg,#4FC3F7,#38BDF8);color:#0D2340;font-weight:800;font-size:13px;border:none;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;margin-top:20px;opacity:{{btnOpacity}};">{{btnLabel}}</button>

  <div style="text-align:center;margin-top:16px;">
    <span style="font-size:12px;color:#94A3B8;">Resend code in {{countdown}}</span>
  </div>

  <div style="margin-top:auto;padding:14px;border-radius:14px;background:#132E50;border:1px solid #1E4270;">
    <p style="font-size:11px;color:#94A3B8;margin:0;line-height:1.6;"><span style="color:#fff;font-weight:700;">Didn't get a code?</span> Check the number entered is correct, or wait for the resend timer above. Codes expire after 5 minutes.</p>
  </div>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { d0:'',d1:'',d2:'',d3:'',d4:'',d5:'', error:'', verifying:false };
  }
  setDigit(i, val) {
    const d = (val || '').replace(/[^0-9]/g,'').slice(-1);
    const next = {}; next['d'+i] = d;
    this.setState(Object.assign({}, next, { error:'' }));
  }
  verify() {
    const code = [this.state.d0,this.state.d1,this.state.d2,this.state.d3,this.state.d4,this.state.d5].join('');
    if (code.length < 6) { this.setState({ error: 'Enter all 6 digits' }); return; }
    this.setState({ verifying: true });
    setTimeout(() => this.setState({ verifying:false, verified:true }), 900);
  }
  renderVals() {
    const st = this.state;
    const digits = [st.d0,st.d1,st.d2,st.d3,st.d4,st.d5];
    const out = {};
    digits.forEach((d,i) => {
      out['d'+i] = d;
      out['bg'+i] = d ? 'rgba(79,195,247,0.1)' : '#132E50';
      out['border'+i] = d ? '#4FC3F7' : (st.error ? '#F87171' : '#1E4270');
      out['color'+i] = d ? '#4FC3F7' : '#fff';
      out['setD'+i] = (e) => this.setDigit(i, e.target.value);
    });
    const filled = digits.every(d => d.length === 1);
    let label = 'Verify & Continue →';
    if (st.verifying) label = 'Verifying…';
    if (st.verified) label = 'Verified ✓ — Opening your account';
    return Object.assign(out, {
      hasError: !!st.error, errorMsg: st.error,
      verify: () => this.verify(),
      btnLabel: label,
      btnOpacity: filled ? '1' : '0.5',
      countdown: '00:28',
    });
  }
}
</script>
</body>
</html>
