<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin:0; }
  .display { font-family:'Plus Jakarta Sans',sans-serif; }
  .noscroll::-webkit-scrollbar { width:0; height:0; }
  .noscroll { -ms-overflow-style: none; scrollbar-width: none; }
  .field-input { background:#132E50; border:1.5px solid #1E4270; border-radius:10px; color:#fff; font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; padding:10px 12px; width:100%; outline:none; }
  .field-input::placeholder { color:#64748B; }
  .field-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:#94A3B8; margin-bottom:5px; display:block; }
  .urg-chip { cursor:pointer; flex:1; text-align:center; padding:9px 0; border-radius:10px; font-size:11px; font-weight:700; border:1.5px solid #1E4270; background:#132E50; color:#94A3B8; }
  .urg-chip.on { border-color:#4FC3F7; background:rgba(79,195,247,0.15); color:#4FC3F7; }
</style>
</helmet>

<div style="width:390px;height:844px;background:#0D2340;display:flex;flex-direction:column;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;color:#fff;position:relative;">

  <div style="flex-shrink:0;background:#0D2340;border-bottom:1px solid #1E4270;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#94A3B8;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Dashboard
    </div>
    <span style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;color:#4FC3F7;">New Corporate Case</span>
    <span style="width:20px;"></span>
  </div>

  <div class="noscroll" style="flex:1;overflow-y:auto;scrollbar-width:none;padding:16px;padding-bottom:100px;">

    <p style="font-size:11px;color:#94A3B8;margin:0 0 16px;">Submitting under <span style="color:#4FC3F7;font-weight:700;">Bupa Global Assistance</span> · Partner #HC-CORP-482</p>

    <div style="display:flex;flex-direction:column;gap:14px;">
      <div>
        <span class="field-label">Patient Full Name *</span>
        <input class="field-input" value="{{patientName}}" onChange="{{setPatientName}}" placeholder="Full legal name"/>
      </div>
      <div>
        <span class="field-label">Patient Contact Number *</span>
        <input class="field-input" value="{{patientPhone}}" onChange="{{setPatientPhone}}" placeholder="+91 98765 43210"/>
      </div>
      <div>
        <span class="field-label">Service Type *</span>
        <select class="field-input" value="{{service}}" onChange="{{setService}}">
          <option>Private Charter Air Ambulance</option>
          <option>Commercial Air Repatriation</option>
          <option>Ground Ambulance</option>
          <option>Wheelchair Assistance</option>
          <option>Hospital Assistance</option>
          <option>Home Health Care & More</option>
        </select>
      </div>
      <div style="display:flex;gap:10px;">
        <div style="flex:1;">
          <span class="field-label">Origin</span>
          <input class="field-input" value="{{origin}}" onChange="{{setOrigin}}" placeholder="City / Airport"/>
        </div>
        <div style="flex:1;">
          <span class="field-label">Destination</span>
          <input class="field-input" value="{{dest}}" onChange="{{setDest}}" placeholder="City / Hospital"/>
        </div>
      </div>
      <div>
        <span class="field-label">Policy / GOP Reference Number</span>
        <input class="field-input" value="{{policyRef}}" onChange="{{setPolicyRef}}" placeholder="e.g. BUPA-GOP-58213" style="font-family:'JetBrains Mono',monospace;"/>
      </div>

      <div>
        <span class="field-label" style="margin-bottom:8px;">Urgency *</span>
        <div style="display:flex;gap:8px;">
          <div class="urg-chip {{onRoutine}}" onClick="{{setRoutine}}">Routine</div>
          <div class="urg-chip {{onUrgent}}" onClick="{{setUrgent}}">Urgent</div>
          <div class="urg-chip {{onCritical}}" onClick="{{setCritical}}">Critical</div>
        </div>
      </div>

      <div>
        <span class="field-label">Case Notes</span>
        <textarea class="field-input" rows="3" style="resize:none;" onChange="{{setNotes}}" placeholder="Clinical summary, special requirements, timing constraints...">{{notes}}</textarea>
      </div>
    </div>

  </div>

  <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(13,35,64,0.95);border-top:1px solid #1E4270;padding:14px 16px;">
    <button onClick="{{submit}}" style="width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,#4FC3F7,#38BDF8);color:#0D2340;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:0.03em;border:none;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;opacity:{{btnOpacity}};">{{btnLabel}}</button>
  </div>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      patientName: '', patientPhone: '', service: 'Private Charter Air Ambulance',
      origin: '', dest: '', policyRef: '', urgency: 'routine', notes: '', status: 'idle',
    };
  }
  submit() {
    const st = this.state;
    if (!st.patientName || !st.patientPhone || st.status !== 'idle') return;
    this.setState({ status: 'saving' });
    setTimeout(() => this.setState({ status: 'done' }), 1000);
  }
  renderVals() {
    const st = this.state;
    const filled = st.patientName && st.patientPhone;
    let label = 'Create Case & Sync Bitrix24 →';
    if (st.status === 'saving') label = 'Creating case…';
    if (st.status === 'done') label = 'Case Created ✓ — Opening Dashboard';
    return {
      patientName: st.patientName, setPatientName: (e) => this.setState({ patientName: e.target.value }),
      patientPhone: st.patientPhone, setPatientPhone: (e) => this.setState({ patientPhone: e.target.value }),
      service: st.service, setService: (e) => this.setState({ service: e.target.value }),
      origin: st.origin, setOrigin: (e) => this.setState({ origin: e.target.value }),
      dest: st.dest, setDest: (e) => this.setState({ dest: e.target.value }),
      policyRef: st.policyRef, setPolicyRef: (e) => this.setState({ policyRef: e.target.value }),
      notes: st.notes, setNotes: (e) => this.setState({ notes: e.target.value }),
      onRoutine: st.urgency === 'routine' ? 'on' : '', setRoutine: () => this.setState({ urgency: 'routine' }),
      onUrgent: st.urgency === 'urgent' ? 'on' : '', setUrgent: () => this.setState({ urgency: 'urgent' }),
      onCritical: st.urgency === 'critical' ? 'on' : '', setCritical: () => this.setState({ urgency: 'critical' }),
      submit: () => this.submit(),
      btnLabel: label,
      btnOpacity: filled ? '1' : '0.5',
    };
  }
}
</script>
</body>
</html>
